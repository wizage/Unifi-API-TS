title: UniFi API TypeScript Client
description: A comprehensive TypeScript client for UniFi Controller API with full type safety and extensive API coverage
url: "https://wizage.github.io"
baseurl: "/Unifi-API-TS"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# GitHub Pages settings
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
header_pages:
  - index.md

# Social links
github_username: wizage
twitter_username: wizages

# SEO
author: wizages
twitter:
  username: wizages
  card: summary

social:
  name: Your Name
  links:
    - https://twitter.com/wizages
    - https://github.com/wizage

# Exclude from processing
exclude:
  - node_modules/
  - package.json
  - package-lock.json
  - README.md